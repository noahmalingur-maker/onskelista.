
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <title>Min önskelista</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0d12;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      text-align: center;
      padding: 75px 20px 35px;
    }

    h1 {
      font-size: clamp(34px, 6vw, 54px);
      letter-spacing: -2px;
      margin: 0 0 12px;
    }

    header p {
      color: #9ca3b3;
      font-size: 16px;
    }

    .produkter {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(240px, 1fr));
      gap: 24px;
      max-width: 1150px;
      margin: 0 auto;
      padding: 25px;
    }

    .kort {
      background: #191d26;
      border: 1px solid #303541;
      border-radius: 22px;
      padding: 15px;
      transition: transform .2s, border-color .2s;
    }

    .kort:hover {
      transform: translateY(-5px);
      border-color: #777f91;
    }

    .bild {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 15px;
      background: #292f3b;
    }

    .platshallare {
      display: flex;
      justify-content: center;
      align-items: center;
      color: #aeb5c3;
      text-align: center;
      padding: 20px;
    }

    h2 {
      font-size: 19px;
      margin: 18px 0 8px;
    }

    .pris {
      color: #bec5d3;
      margin: 0 0 20px;
      font-size: 16px;
    }

    .knapp {
      display: block;
      padding: 14px;
      border-radius: 12px;
      background: #fff;
      color: #111;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      transition: background .2s;
    }

    .knapp:hover {
      background: #dce3f0;
    }

    #status {
      text-align: center;
      color: #aeb5c3;
      padding: 30px 20px;
    }

    footer {
      text-align: center;
      color: #777e8d;
      padding: 50px 20px;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Min önskelista ✨</h1>
    <p>Alla saker jag önskar mig, på ett ställe.</p>
  </header>

  <main id="produkter" class="produkter"></main>
  <p id="status">Laddar önskelistan...</p>

  <footer>Min önskelista</footer>

  <script>
    const SUPABASE_URL =
      "https://okxsjemvfyjvwcfqgvbj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_rhmzBVDnUgnyCZ5mHBWYmA_bo8gFQEh";

    async function laddaProdukter() {
      const container =
        document.getElementById("produkter");

      const status =
        document.getElementById("status");

      try {
        const response = await fetch(
          SUPABASE_URL +
          "/rest/v1/products?select=*&order=id.desc",
          {
            method: "GET",
            headers: {
              "apikey": SUPABASE_KEY,
              "Accept": "application/json"
            }
          }
        );

        if (!response.ok) {
          const details = await response.text();

          throw new Error(
            "HTTP " + response.status + ": " + details
          );
        }

        const produkter = await response.json();

        if (!Array.isArray(produkter)) {
          throw new Error("Ogiltigt databassvar");
        }

        container.replaceChildren();

        if (produkter.length === 0) {
          status.textContent =
            "Inga önskningar har lagts till ännu.";
          return;
        }

        status.textContent = "";

        for (const produkt of produkter) {
          const kort = document.createElement("article");
          kort.className = "kort";

          if (
            produkt.image_url &&
            /^https?:\/\//i.test(produkt.image_url)
          ) {
            const bild = document.createElement("img");
            bild.className = "bild";
            bild.src = produkt.image_url;
            bild.alt = produkt.name || "Produkt";
            bild.loading = "lazy";

            kort.appendChild(bild);
          } else {
            const platshallare =
              document.createElement("div");

            platshallare.className =
              "bild platshallare";

            platshallare.textContent =
              "Produktbild kommer snart";

            kort.appendChild(platshallare);
          }

          const namn = document.createElement("h2");
          namn.textContent =
            produkt.name || "Produkt";

          kort.appendChild(namn);

          if (produkt.price) {
            const pris = document.createElement("p");
            pris.className = "pris";
            pris.textContent = produkt.price;

            kort.appendChild(pris);
          }

          if (
            produkt.product_url &&
            /^https?:\/\//i.test(produkt.product_url)
          ) {
            const knapp = document.createElement("a");

            knapp.className = "knapp";
            knapp.href = produkt.product_url;
            knapp.target = "_blank";
            knapp.rel = "noopener noreferrer";
            knapp.textContent = "Visa produkt ↗";

            kort.appendChild(knapp);
          }

          container.appendChild(kort);
        }

      } catch (error) {
        console.error("Fel vid laddning:", error);

        status.textContent =
          "Kunde inte ladda önskelistan. " +
          "Kontrollera anslutningen till Supabase.";
      }
    }

    laddaProdukter();
  </script>
</body>
</html>
